<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#05010a" />
    <title>Pumpkin Smash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎃</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="player">
    <canvas id="stage"></canvas>

    <div id="hud" hidden>
      <div id="hud-room"></div>
      <div id="hud-act"><span id="hud-act-name"></span><span id="hud-timer"></span></div>
      <div id="hud-inv">
        <span id="inv-pumpkin" hidden></span>
        <span id="inv-hammer" hidden>🔨</span>
        <span id="inv-souls"><i class="soul-dot"></i><b id="inv-souls-n">0</b></span>
      </div>
      <div id="hud-ticker"></div>
    </div>

    <div id="banner" hidden><div id="banner-title"></div><div id="banner-sub"></div></div>
    <div id="screen"></div>

    <div id="death" hidden>
      <canvas id="death-canvas"></canvas>
      <div class="death-text">
        <div id="death-title"></div>
        <div id="death-sub"></div>
        <div id="death-count"></div>
      </div>
    </div>

    <div id="paused" hidden><div>⏸ PAUSED</div><small>The host froze time. Even the ghosts are waiting.</small></div>
    <div id="toast" hidden></div>

    <div id="controls">
      <button id="btn-mode" title="Spooky / Mild"></button>
      <button id="btn-mute" title="Mute"></button>
      <button id="btn-fs" title="Full screen">⛶</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared.js"></script>
    <script src="/common.js"></script>
    <script src="/player.js"></script>
  </body>
</html>
