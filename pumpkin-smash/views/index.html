<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..900,0..100,0..1;1,9..144,500..900,0..100,0..1&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><ellipse cx=%2250%22 cy=%2256%22 rx=%2242%22 ry=%2234%22 fill=%22%23FF7A1A%22/><path d=%22M28 50h14l-7-13zM58 50h14l-7-13z%22 fill=%22%230A0908%22/></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="player">
    <canvas id="room" class="layer" hidden></canvas>
    <canvas id="fx" class="layer"></canvas>

    <div id="hud" hidden>
      <div id="hud-inv">
        <canvas id="inv-pumpkin" width="68" height="68" hidden></canvas>
        <span id="inv-hammer" class="hammer" hidden></span>
        <span><i class="mote"></i><span id="inv-souls" class="num">0</span></span>
        <span id="inv-hp" class="hp" title="Your lantern. Three hits from a zombie and it goes out."><i></i><i></i><i></i></span>
      </div>
      <div id="hud-timer" class="num"></div>
      <div id="hud-room"></div>
      <div id="hud-ticker"></div>
    </div>

    <div id="banner" hidden><div id="banner-title" class="display"></div><div id="banner-sub"></div></div>
    <div id="screen"></div>

    <div id="death" hidden>
      <canvas id="death-canvas"></canvas>
      <div class="death-text">
        <div id="death-title" class="display"></div>
        <div id="death-sub"></div>
        <div id="death-count"></div>
      </div>
    </div>

    <div id="paused" hidden><div class="display">Paused.</div><div class="quiet">Even the ghosts are waiting.</div></div>
    <div id="toast" hidden></div>

    <div id="controls">
      <button id="btn-mode" class="textbtn"></button>
      <button id="btn-mute" class="textbtn"></button>
      <button id="btn-fs" class="textbtn">Full screen</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared.js"></script>
    <script src="/common.js"></script>
    <script src="/room.js"></script>
    <script src="/player.js"></script>
  </body>
</html>
